name: Release Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: safeEnv
            asset_name: safeEnv-linux-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: safeEnv.exe
            asset_name: safeEnv-windows-amd64.exe
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: safeEnv
            asset_name: safeEnv-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: safeEnv
            asset_name: safeEnv-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary Unix
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/${{ matrix.binary_name }} ${{ matrix.asset_name }}

      - name: Rename binary Windows
        if: matrix.os == 'windows-latest'
        run: Rename-Item -Path "target\${{ matrix.target }}\release\${{ matrix.binary_name }}" -NewName "${{ matrix.asset_name }}"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}